# Reverse proxy for the Eurolink claims dashboard.
# Install at /etc/nginx/sites-available/eclaims-report, then:
#   ln -s /etc/nginx/sites-available/eclaims-report /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The app binds to 127.0.0.1:8501 only (see gunicorn.conf.py / eclaims.service)
# -- it is never exposed directly to the internet, only through this proxy.

server {
    listen 80;
    listen [::]:80;
    server_name your-domain-or-ip;  # <-- replace with the VPC server's domain or public IP

    # Must be >= MAX_UPLOAD_MB in app.py (currently 100 MB) or nginx will
    # reject large uploads with its own 413 before the app ever sees them.
    client_max_body_size 105m;

    # Everything, including /static/*, is proxied to gunicorn -- Flask serves
    # static files itself. (An nginx `alias` straight into the app directory
    # would need that directory's parents to be traversable by the nginx
    # worker user; when the app lives under a restrictive home dir like
    # /root, loosening those permissions is the wrong tradeoff for serving a
    # handful of small CSS/JS/SVG files. Add a static `alias` block back here
    # if you deploy under a normally-permissioned path instead and want the
    # minor extra speed of nginx serving them directly.)
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
