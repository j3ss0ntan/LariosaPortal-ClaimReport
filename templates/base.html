<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Eurolink Claims Submission{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head_scripts %}{% endblock %}
</head>
<body>
  <div id="upload-progress-overlay" class="upload-progress-overlay visible indeterminate" role="status" aria-live="polite">
    <div class="upload-progress-card">
      <div class="upload-progress-ring-wrap">
        <svg class="upload-progress-ring" viewBox="0 0 80 80">
          <circle class="upload-progress-ring-bg" cx="40" cy="40" r="34"></circle>
          <circle id="upload-progress-circle" class="upload-progress-ring-fg" cx="40" cy="40" r="34"></circle>
        </svg>
        <span id="upload-progress-percent" class="upload-progress-percent">0%</span>
      </div>
      <div id="upload-progress-label" class="upload-progress-label">Loading&hellip;</div>
    </div>
  </div>
  <script>
    window.addEventListener("load", function () {
      var overlay = document.getElementById("upload-progress-overlay");
      if (overlay) overlay.classList.remove("visible", "indeterminate");
    });
  </script>
  {% with messages = get_flashed_messages(with_categories=true, category_filter=['success', 'error']) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='pw-reveal.js') }}"></script>
  <script src="{{ url_for('static', filename='password-toggle.js') }}"></script>
  <script src="{{ url_for('static', filename='upload-progress.js') }}"></script>
</body>
</html>
